name: Build PDF
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_pdflatex: true
      - uses: actions/upload-artifact@v4
        with:
          name: Linear-Algebra-Tutorial-Solutions
          path: main.pdf
